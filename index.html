    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/gameStyle.css">
	<link rel="icon" href="./assets/favicon.ico">

    <script defer src="./scripts/helpers.js"></script>
    <script defer src="./scripts/timer.js"></script>
    <script defer src="./scripts/events.js"></script>
    <script defer src="./scripts/reactivity.js"></script>

<body data-css-debug="false">
	<div class="page-background"></div>
	<div class="container">
		<header>
			<h1>2048</h1>
			<!-- <p>HTML5 boilerplate.</p> -->
		</header>

		<main>
			<!-- Game root -->
             <!-- Game will be mounted here. -->
			<div id="game" data-autopause="false">
                <div id="statsArea">
					<div class="field-sub-box">
						<div id="scoreBox" class="field-box">
							<span class="score field-name">
								Score
							</span>
							<span id="score-value" class="score field-value" data-reactive="score">
								0
							</span>
						</div>
						<div id="bestBox" class="field-box">
							<span class="best field-name">
								Best
							</span>
							<span id="best-value" class="best field-value" data-reactive="best">
								0
							</span>
						</div>
					</div>
					<div class="field-sub-box">
						<div id="timerBox" class="field-box">
							<span class="timer field-name">
								Timer
							</span>
							<span id="timer-value" class="timer field-value" data-reactive="timer">
								00:00
							</span>
						</div>
						<div id="movesBox" class="field-box">
							<span class="moves field-name">
								Moves
							</span>
							<span id="moves-value" class="moves field-value" data-reactive="moves">
								0
							</span>
						</div>
					</div>
				</div>
                <div id="gameBoard"></div>
				<div id="buttonArea">
					<button id="resetBtn" class="button reset" onclick="btn_newGame(this);">

					<button id="togglePauseBtn" class="button toggle" onclick="btn_togglePause(this);">
						Pause
					</button>
					<button id="histBtn" class="button show-history" onclick="btn_showHistory(this);">
						History
					</button>
				</div>
				<div id="stateArea" data-active="false">
					<span class="gameStatus"></span>
				</div>
            </div>
		</main>

		<footer>
			<span class="footer-name">
				<span class="footer-author">
					David Jarvis
				</span>
				<small>&copy;<span id="year"></span></small>
			</span>
		</footer>
	</div>

	<script>
		// Small script to set year
		document.getElementById('year').textContent = new Date().getFullYear();
	</script>
	<script>
		if ('serviceWorker' in navigator) {
		navigator.serviceWorker.register('/service-worker.js')
			.then((reg) => console.log('Service Worker registered:', reg.scope))
			.catch((err) => console.error('SW registration failed:', err));
		}
	</script>
	<!-- <button class="css-debug button check-viewport">(X,Y)</button> -->
</body>
</html>
